<header class="bar">
  <div class="wrap bar__in">
    <a class="bar__mark" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <nav class="bar__nav" aria-label="Primary">
      {%- for item in site.data.navigation.main %}
      <a href="{{ item.url | relative_url }}"
         {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
    </nav>
  </div>
</header>
