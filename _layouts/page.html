---
layout: inner
---
<div class="wrap head">
  <h1 class="head__title">{{ page.title }}</h1>
  {%- if page.tagline %}<p class="head__tag">{{ page.tagline }}</p>{%- endif %}
</div>

<div class="wrap">
  <article class="prose{% if page.wide %} prose--wide{% endif %}">
    {{ content }}
  </article>
</div>
