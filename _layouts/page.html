---
layout: classic
---
<div class="wrap page-head">
  <h1 class="page-head__title">{{ page.title }}</h1>
  {%- if page.tagline %}<p class="page-head__tagline">{{ page.tagline }}</p>{%- endif %}
</div>

<div class="wrap">
  <article class="prose{% if page.wide %} prose--wide{% endif %}">
    {{ content }}
  </article>
</div>
